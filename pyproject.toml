[project]
name = "docsrag"
version = "0.2.0"
description = "Retrieval-augmented question answering over a school IT help-desk knowledge base: pgvector, hybrid search, FastAPI."
readme = "README.md"
authors = [{ name = "Alphonce Mukavhi", email = "alphoncemukavhi@gmail.com" }]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "prometheus-client>=0.20",
    "numpy>=2.2",
    "psycopg[binary]>=3.2",
    "pgvector>=0.4",
    "fastapi>=0.140",
    "uvicorn>=0.40",
    "pydantic>=2.12",
    "redis>=6",
    "httpx>=0.28",
]

[project.optional-dependencies]
hf = ["sentence-transformers>=5"]

[project.scripts]
docsrag = "docsrag.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff", "mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docsrag"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs PostgreSQL with pgvector (set DOCSRAG_TEST_DSN)"]

[tool.mypy]
strict = true
ignore_missing_imports = true
