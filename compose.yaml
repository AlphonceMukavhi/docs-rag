# Local stack: API + PostgreSQL with pgvector + Redis. Not production as written.
services:
  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: docsrag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: docsrag
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docsrag -d docsrag"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DOCSRAG_DSN: postgresql://docsrag:${POSTGRES_PASSWORD}@db:5432/docsrag
      DOCSRAG_REDIS_URL: redis://redis:6379/0
      DOCSRAG_API_KEYS: ${API_KEYS:?set API_KEYS in .env}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
