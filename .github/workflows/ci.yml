name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: docsrag
          POSTGRES_PASSWORD: docsrag
          POSTGRES_DB: docsrag_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U docsrag"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DOCSRAG_TEST_DSN: postgresql://docsrag:docsrag@localhost:5432/docsrag_test
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: uv sync --python 3.14
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest -q
      - name: Retrieval quality gate
        run: |
          uv run docsrag --dsn "$DOCSRAG_TEST_DSN" ingest --corpus corpus
          uv run docsrag --dsn "$DOCSRAG_TEST_DSN" eval --k 5 --min-hit-rate 0.9
